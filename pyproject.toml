[project]
name = "secondwind"
version = "0.1.0"
description = "Second Wind: a personal AI coach in Telegram"
requires-python = ">=3.12"
license = "LicenseRef-PolyForm-Noncommercial-1.0.0"

# Runtime dependencies are pinned per image in requirements/*.txt.

[tool.mypy]
python_version = "3.12"
# Libraries without type information (fitparse, google namespace packages) are treated as Any.
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
