# Questions answered from the data or by a calculator, without the AI model.
# A message that matches `to_model` (why, how to improve, is it normal, ...) always goes to the
# model (first to the scope classifier), even if an intent below matches. Any word about symptoms is
# here too, so that a fact rule never answers a message that may be an emergency. Parameters (period, metric, numbers) are extracted in
# code (secondwind/core/router.py). Order matters: the first matching intent wins.
to_model:
  ru: ['почему|зачем|из-за чего|как (улучшить|поднять|снизить|исправить|восстановиться)|что (делать|посоветуешь)|нормальн\w*|стоит ли|можно ли|надо ли|нужно ли|план|совет|оцени|проанализируй|сравни|нужен|нужна|\b(болит|болят|боль|боли|болело)\b|травм|устал|тяжел|плохо|\bгруд|\bсердц|\bсердеч|дыш|дыха|воздух|одышк|сознан|голов[аыуе]?\b|кружит|тошн|рвот|кров|неме|онем|отек|опух|\bно(ет|ют|ло)\b|температур|озноб|слабост|моч[аиуе]\b|глаза|\bмного\b|\bмало\b|достаточно|слишком']
  en: ["why|how (do|can|should) i (improve|raise|lower|fix|recover)|what should|normal|is it ok|should i|can i|plan|advice|analy[sz]e|compare|evaluate|\\bneed\\b|\\b(hurts?|pain|sore|injur\\w*|tired|terrible|awful|bad|chest|breath\\w*|faint\\w*|dizz\\w*|headaches?|vision|blurr\\w*|blood|numb\\w*|swollen|swelling|vomit\\w*|nause\\w*|fever|weakness|confus\\w*|collaps\\w*|a lot|enough|too (much|little|many|few))\\b"]
intents:
  - intent: calc.race_predict
    ru: ['прогноз\w*\W+(\w+\W+){0,3}(\d+([.,]\d+)?\s*(км|k)\b|марафон|полумарафон)', 'за сколько\W+(\w+\W+){0,2}(пробегу|пробежал бы|осилю)', 'на (какое время|что)\W+(\w+\W+){0,2}бегу']
    en: ['predict\w*\W+(\w+\W+){0,3}(\d+(\.\d+)?\s*(km|k)\b|marathon|half)', 'what (time )?(could|can|would) i run', 'race (time )?prediction']
  - intent: calc.pace
    ru: ['\d+([.,]\d+)?\s*(км|k)\b.{0,12}\bза\s*\d', 'темп\w*\s*\d+[:.]\d\d', '\d+[:.]\d\d\s*(на|/)\s*км']
    en: ['\d+(\.\d+)?\s*(km|k)\b.{0,12}\bin\s*\d', 'pace (of )?\d+[:.]\d\d', '\d+[:.]\d\d\s*(per|/)\s*km']
  - intent: calc.zones
    ru: ['\b(какие|покажи|напомни)\W+(\w+\W+){0,3}зоны\b', '^\W*(мои )?(пульсов\w* )?зоны( пульса)?\W*$']
    en: ['\b(what are my|show( me)?( my)?)\W+(\w+\W+){0,2}zones\b', '^\W*(my )?(heart ?rate |hr )?zones\W*$']
  - intent: fact.records
    ru: ['(мои |какие |покажи )?рекорд\w*', 'лучш\w+ (время|результат)\w* на (\d|марафон|полумарафон)']
    en: ['\bpersonal (records?|bests?)\b', '\b(my|show|what are my)\W+(\w+\W+){0,2}(records?|bests|prs?|pbs?)\b']
  - intent: fact.last_workout
    ru: ['последн\w+ (тренировк|пробежк|занят|активност)\w*']
    en: ['(last|latest|previous) (workout|run|activity|session|training)']
  - intent: fact.run_distance
    ru: ['сколько\W+(\w+\W+){0,3}(пробежал|набегал|км)', 'какой (у меня )?(объ[её]м|километраж)']
    en: ['how (far|many (km|kilometers|kilometres)|much) (\w+\W+){0,2}(run|ran)', '(running )?(mileage|volume|distance) (this|last)']
  - intent: fact.metric
    ru: ['(какой|какая|какое|какие|сколько|покажи|скажи)\W+(\w+\W+){0,4}(пульс\w* (в )?поко|чсс поко|hrv|вариабельн|сон|спал|шаг|body battery|батаре|стресс|vo2|мпк)']
    en: ['(what|how much|how many|how long|show|tell)\W+(\w+\W+){0,4}(resting (heart rate|hr)|\brhr\b|hrv|sleep|slept|steps|body battery|stress|vo2)']
